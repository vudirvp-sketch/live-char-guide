<body class="theme-dark">
  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
    <div class="loading-text">Загрузка...</div>
  </div>

  <!-- Main content area (auto-loaded, no modal).
       iter-193: the reading layout — TOC rail | content | tool dock — is a grid
       built by CSS (.layout-grid); #content stays the sole content container. -->
  <div class="layout-grid" id="layout-grid">
    <!-- READING RAIL: persistent TOC (variant A, iter-193). Populated by
         buildRailTOC() in lazy-loader.js from the same section model as the
         TOC panel. Hidden below 1220px; the reading bar takes over. -->
    <nav class="toc-rail" id="toc-rail" aria-label="Содержание"></nav>
    <main id="content" class="content-hidden"></main>
    <!-- TOOL DOCK: the former floating FAB group, docked to the grid (iter-193) -->
    <div class="tool-dock" id="tool-dock" role="toolbar" aria-label="Инструменты"></div>
  </div>

  <!-- READING BAR: sticky «Part › Section» header for narrow screens
       (iter-193). Under 1220px the rail hides and this bar shows the current
       position + progress; the ☰ sheet opens the full TOC. -->
  <div class="reading-bar" id="reading-bar" hidden>
    <button class="reading-bar-btn" id="reading-bar-btn" aria-expanded="false" aria-controls="toc-rail-sheet">
      <span class="reading-bar-crumb" id="reading-bar-crumb">Содержание</span>
      <span class="reading-bar-pct" id="reading-bar-pct">0%</span>
      <span aria-hidden="true">☰</span>
    </button>
    <div class="reading-bar-fill" id="reading-bar-fill" role="progressbar" aria-label="Прогресс чтения" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    <nav class="reading-sheet" id="toc-rail-sheet" aria-label="Содержание"></nav>
  </div>
  <noscript>
    <div style="padding:2em;text-align:center;color:var(--text,#E8E8E8);font-family:sans-serif;">
      <h1>Live Character Guide</h1>
      <p>Для работы этого руководства требуется JavaScript. Пожалуйста, включите JavaScript в настройках браузера.</p>
      <p><a href="parts/glossary.html">Глоссарий (версия без JavaScript)</a></p>
    </div>
  </noscript>

  <!-- FAB BUTTONS GROUP (moved into .tool-dock by lazy-loader.js, iter-193).
       Kept as the source markup for the buttons + the no-JS/JS-off fallback;
       the dock re-parents them on init. -->
  <div class="fab-group hidden" id="fab-group">
    <!-- iter-194: the soft-dark theme is the default (body.theme-dark in the
         <body> tag, so the first paint is already #0f1218, no OLED→dark flash);
         the cycle OLED → soft-dark → light stays three-state (DEC-35).
         The single glyph ◐ replaces the sun/moon pair. -->
    <button class="fab-btn" id="fab-theme" title="Тема (Тёмная → Светлая → OLED)" aria-label="Сменить тему" type="button" data-theme="dark">◐</button>
    <button class="fab-btn" id="fab-scratchpad" aria-label="Open scratchpad" title="Блокнот для записей" type="button">📝</button>
    <button class="fab-btn" id="fab-glossary" aria-label="Open glossary" title="Глоссарий" type="button">📖</button>
    <button class="fab-btn" id="fab-toc" title="Содержание" aria-label="Открыть содержание" type="button">📑</button>
    <button class="fab-btn" id="fab-top" aria-label="Scroll to top" title="Наверх" type="button">↑</button>
  </div>

  <!-- TOC PANEL -->
  <div id="toc-panel" class="panel" role="dialog" aria-label="Содержание" tabindex="-1">
    <div class="panel-header" data-drag-handle>
      <span class="panel-header-title">📑 Содержание</span>
      <div class="panel-header-actions">
        <button class="panel-btn" data-action="close" title="Закрыть" aria-label="Закрыть">✕</button>
      </div>
    </div>
    <div class="panel-content" id="toc-content"></div>
    <div class="panel-resize-handle" data-resize-handle></div>
  </div>

  <div id="notepad-panel" class="panel" tabindex="-1" aria-label="Блокнот">
    <div class="panel-header" data-drag-handle>
      <span class="panel-header-title">📝 Блокнот</span>
      <div class="panel-header-actions">
        <button class="panel-btn" data-action="save" title="Сохранить" aria-label="Сохранить заметки">💾</button>
        <button class="panel-btn" data-action="clear" title="Очистить" aria-label="Очистить заметки">🗑</button>
        <button class="panel-btn" data-action="export" title="Экспорт" aria-label="Экспортировать заметки">📋</button>
        <button class="panel-btn" data-action="close" title="Закрыть" aria-label="Закрыть панель">×</button>
      </div>
    </div>

      class="panel-content panel-textarea"
      id="notepad-content"
      placeholder="Ваши заметки..."
      spellcheck="false"
      aria-label="Текст заметок"
    ></textarea>
    <div class="panel-resize-handle" data-resize-handle></div>
  </div>
