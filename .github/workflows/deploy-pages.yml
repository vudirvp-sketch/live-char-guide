name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'visual-system/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'index.html'
      - 'eslint.config.js'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unified artifacts (shell architecture)
        run: pnpm run build

      - name: Validate artifacts
        run: pnpm run validate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
          retention-days: 5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke Test
        continue-on-error: true
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Deployed to: $PAGE_URL"
          # Wait for GitHub Pages propagation (can take a few seconds)
          sleep 10
          # Basic reachability check — failures are warnings, not blocking
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PAGE_URL" || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Page reachable (HTTP $HTTP_CODE)"
          else
            echo "WARN: Page returned HTTP $HTTP_CODE (may need more time to propagate)"
          fi

      - name: Create Deploy Tag
        if: success()
        run: |
          TAG="deploy-$(date +%Y%m%d-%H%M%S)"
          git tag $TAG
          git push origin $TAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
