  <link rel="stylesheet" href="../DESIGN-TOKENS.css">

  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/patterns.css">

  <style>
    .hub-spoke-container {
      max-width: 700px;
      margin: 0 auto;
      position: relative;
      aspect-ratio: 1 / 0.85;
    }

    .hub-spoke-container svg {
      width: 100%;
      height: 100%;
    }

    /* Spoke hover effect */
    .spoke-line {
      transition: stroke-width 0.2s;
    }

    .spoke-line:hover {
      stroke-width: 2px;
    }

    /* Node hover effect */
    .directive-node {
      cursor: default;
      transition: filter 0.2s;
    }

    .directive-node:hover {
      filter: brightness(1.2);
    }

    /* Scroll animations */
    .hub-spoke-container svg .anim-group {
      opacity: 0;
      transition: opacity var(--duration-base) var(--ease-out-expo);
    }

    .hub-spoke-container svg .anim-group.is-visible {
      opacity: 1;
    }

    .hub-spoke-container svg .center-pulse {
      transform-origin: 350px 220px;
      animation: none;
    }

    .hub-spoke-container svg .center-pulse.is-visible {
      animation: pulse-once 600ms var(--ease-out-expo);
    }

    @keyframes pulse-once {
      0% { r: 38; }
      50% { r: 44; }
      100% { r: 38; }
    }

    /* Stagger */
    .hub-spoke-container svg .anim-group:nth-of-type(1) { transition-delay: 0ms; }
    .hub-spoke-container svg .anim-group:nth-of-type(2) { transition-delay: 100ms; }
    .hub-spoke-container svg .anim-group:nth-of-type(3) { transition-delay: 200ms; }
    .hub-spoke-container svg .anim-group:nth-of-type(4) { transition-delay: 300ms; }
    .hub-spoke-container svg .anim-group:nth-of-type(5) { transition-delay: 400ms; }
    .hub-spoke-container svg .anim-group:nth-of-type(6) { transition-delay: 500ms; }
    .hub-spoke-container svg .anim-group:nth-of-type(7) { transition-delay: 600ms; }
    .hub-spoke-container svg .anim-group:nth-of-type(8) { transition-delay: 700ms; }

    /* Model badge */
    .model-badge {
      fill: var(--accent-cyan);
      font-family: var(--font-mono);
      font-size: 9px;
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) {
        document.querySelectorAll('.anim-group, .center-pulse, .scroll-enter').forEach(el => el.classList.add('is-visible'));
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      document.querySelectorAll('.anim-group, .center-pulse, .scroll-enter').forEach(el => observer.observe(el));
    });
  </script>
